<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <ul class="nav nav-pills bg-dark py-3 justify-content-center mb-5" data-bs-theme="dark">
        <li class="nav-item">
            <a class="nav-link link-light link-opacity-75-hover fw-semibold" th:href="@{/produtos}">Produtos</a>
        </li>

        <li class="nav-item">
            <a class="nav-link link-light link-opacity-75-hover fw-semibold" th:href="@{/clientes}">Clientes</a>
        </li>
    </ul>

    <div class="container">
        <a class="small link-secondary link-opacity-50-hover" th:href="@{/produtos}">Voltar para a lista de produtos</a>

        <h1 class="mb-3">Cadastrar Produto</h1>

        <form class="row g-3 needs-validation"
              novalidate
              th:action="@{/produtos/salvar}"
              th:object="${produto}"
              method="post">
            <div class="col-md-12">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Ex: MousePad 90cmx60cm" required>
                <div class="invalid-feedback">
                    Preencha o nome do produto.
                </div>
            </div>

            <div class="col-md-12">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control" id="descricao" rows="3" th:field="*{descricao}" placeholder="Ex: Design moderno e confortável para o cliente" required></textarea>
                <div class="invalid-feedback">
                    Preencha a descrição do produto.
                </div>
            </div>

            <div class="col-md-6">
                <label for="preco" class="form-label">Preço</label>
                <input type="number" class="form-control" id="preco" th:field="*{preco}" placeholder="Ex: 9,99" required>
                <div class="invalid-feedback">
                    Preencha o preço do produto.
                </div>
            </div>

            <div class="col-md-6">
                <label for="estoque" class="form-label">Quantidade em Estoque</label>
                <input type="number" class="form-control" id="estoque" th:field="*{estoque}" placeholder="Ex: 5" required>
                <div class="invalid-feedback">
                    Preencha a quantidade em estoque do produto.
                </div>
            </div>

            <div class="col-12">
                <button class="btn btn-primary" type="submit">Cadastrar</button>
            </div>
        </form>
        <br>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>
</html>
