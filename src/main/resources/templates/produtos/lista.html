<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <ul class="nav nav-pills bg-dark py-3 justify-content-center mb-5" data-bs-theme="dark">
        <li class="nav-item">
            <a class="nav-link link-light link-opacity-75-hover fw-semibold active" th:href="@{/produtos}">Produtos</a>
        </li>

        <li class="nav-item">
            <a class="nav-link link-light link-opacity-75-hover fw-semibold" th:href="@{/clientes}">Clientes</a>
        </li>
    </ul>

    <div class="container">
        <h1 class="mb-3">Produtos Cadastrados</h1>
        <a class="btn btn-primary mb-4" th:href="@{/produtos/novo}">Cadastrar novo produto</a>

        <table class="table">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Descrição</th>
                    <th scope="col">Preço</th>
                    <th scope="col">Quant. Estoque</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="produto : ${produtos}">
                    <th scope="col" th:text="${produto.id}"></th>
                    <td th:text="${produto.nome}"></td>
                    <td th:text="${produto.descricao}"></td>
                    <td th:text="${produto.preco}"></td>
                    <td th:text="${produto.estoque}"></td>
                </tr>
            </tbody>
        </table>

        <p class="text-muted" th:if="${#lists.isEmpty(produtos)}">Nenhum produto cadastrado.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>
</html>
